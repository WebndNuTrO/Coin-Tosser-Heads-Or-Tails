<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Python Web App</title>
    
    <!-- Link to the PyScript Core files -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net"></script>

    <!-- Dark Theme Styling -->
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 5px;
        }
        p {
            color: #a0a0a0;
            margin-bottom: 30px;
        }
        .btn-run {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 20px;
        }
        .btn-run:hover {
            background-color: #059669;
        }
        /* Custom Terminal Output Styling */
        #terminal-output {
            background-color: #1e1e1e;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #333;
            min-height: 150px;
            white-space: pre-wrap;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>
<body>

    <h1>Welcome to My Browser App</h1>
    <p>Click the button below to run the Python code natively in your browser.</p>

    <!-- Run Button -->
    <button class="btn-run" id="run-btn">Run Code</button>

    <!-- Terminal screen where PyScript will display your code results -->
    <div id="terminal-output">Click "Run Code" to execute the script...</div>

    <!-- The PyScript logic setup -->
    <script type="py" config="./pyscript.toml">
        from pyodide.ffi import create_proxy
        from js import document
        import main

        # Function that handles the button click event
        def on_click_handler(event):
            # Clear out the initial text placeholder
            document.getElementById("terminal-output").innerHTML = ""
            # Run the primary function inside your main.py file
            main.run_my_script()

        # Connect the Python click handler function to the HTML button
        click_proxy = create_proxy(on_click_handler)
        document.getElementById("run-btn").addEventListener("click", click_proxy)
    </script>

</body>
</html>
