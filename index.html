<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coin Tosser Web App</title>
    
    <!-- Core PyScript Setup -->
    <link rel="stylesheet" href="https://pyscript.net" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Dark Theme Styling -->
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
            text-align: center;
        }
        h1 {
            color: #ffffff;
            margin-bottom: 5px;
        }
        p {
            color: #a0a0a0;
            margin-bottom: 30px;
        }
        .btn-run {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .btn-run:hover {
            background-color: #059669;
        }
        .btn-run:active {
            transform: scale(0.98);
        }
        /* Visual Dark Terminal Output */
        #terminal-output {
            background-color: #1e1e1e;
            color: #38bdf8;
            font-family: 'Courier New', Courier, monospace;
            font-size: 22px;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #333;
            min-height: 100px;
            white-space: pre-wrap;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            max-width: 400px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Browser App</h1>
    <p>Click the button below to flip the coin natively in your browser.</p>

    <!-- The native py-click handler links directly to the Python function name -->
    <button class="btn-run" id="run-btn" py-click="flip_the_coin">Flip Coin 🪙</button>

    <div id="terminal-output">Loading Python environment... Ready!</div>

    <!-- Clean, Direct Inline Python Logic -->
    <script type="py">
        import random
        from pyscript import display

        def flip_the_coin(event):
            # Roll your game logic
            tosser = random.randint(0, 1)
            
            if tosser == 0:
                display("Heads 🪙", target="terminal-output", append=False)
            else:
                display("Tails 🪙", target="terminal-output", append=False)
    </script>

</body>
</html>
